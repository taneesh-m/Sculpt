name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      # Playwright e2e is intentionally not run here -- it needs a live
      # Supabase project (local Docker Postgres isn't available/practical
      # in this CI setup) and real auth flows. Run `pnpm test:e2e` locally
      # before merging changes that touch auth, data, or routing.
