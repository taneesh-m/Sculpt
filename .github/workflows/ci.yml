name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # GitHub-hosted runners have Docker, so we can spin up a real, ephemeral
      # Supabase stack (Postgres + Auth + all migrations applied) and run the
      # full signup/onboarding/CRUD e2e against it -- hermetic, no hosted data
      # touched, and email confirmations are off in the local config so signup
      # returns a session immediately.
      # Version is pinned (not `latest`) because resolving `latest` goes through
      # the unauthenticated GitHub API, which rate-limits per runner IP and
      # intermittently fails this job before Supabase ever starts. github-token
      # authenticates that lookup too, if this moves back to a floating version.
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Supabase (applies migrations)
        run: supabase start

      - name: Export local Supabase env
        run: |
          # `-o env` prints the whole var set (dotenv-style, values may be
          # quoted); pull out just the one renamed line per call and strip
          # quotes so $GITHUB_ENV gets a clean KEY=value.
          supabase status -o env --override-name api.url=NEXT_PUBLIC_SUPABASE_URL \
            | grep '^NEXT_PUBLIC_SUPABASE_URL=' | tr -d '"' >> "$GITHUB_ENV"
          supabase status -o env --override-name auth.anon_key=NEXT_PUBLIC_SUPABASE_ANON_KEY \
            | grep '^NEXT_PUBLIC_SUPABASE_ANON_KEY=' | tr -d '"' >> "$GITHUB_ENV"

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
